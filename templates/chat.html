<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат на Python</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: #f0f0f0;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .chat-box {
            height: 400px;
            overflow-y: scroll;
            background: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            display: flex;
            flex-direction: column;
        }
        .message {
            background: #e1ffc7;
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 12px;
            max-width: 80%;
            min-width: 150px;
            align-self: flex-start;
            word-wrap: break-word;
        }
        .message .username {
            font-weight: bold;
            color: #2c3e50;
            display: block;
            margin-bottom: 4px;
            font-size: 0.9em;
        }
        .message .text {
            display: block;
            margin-bottom: 6px;
            font-size: 1em;
        }
        .message .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7em;
            color: #7f8c8d;
            border-top: 1px dashed #ddd;
            padding-top: 4px;
        }
        .message .time {
            margin-right: 10px;
        }
        .message .date-label {
            background: #f0f0f0;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.9em;
        }
        /* Свои сообщения (от текущего пользователя) — справа */
        .message.my-message {
            align-self: flex-end;
            background: #dcf8c6;
        }
        #chat-form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        #chat-form input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            flex: 1;
        }
        #chat-form button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            flex: 0 0 auto;
        }
        #chat-form button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <h2>📱 Чат на Python</h2>
    <div class="chat-box" id="chat-box"></div>

    <form id="chat-form">
        <input type="text" id="username" placeholder="Ваше имя" required>
        <input type="text" id="text" placeholder="Сообщение" required>
        <button type="submit">Отправить</button>
    </form>

    <script>
        const chatBox = document.getElementById('chat-box');
        const form = document.getElementById('chat-form');

        // Функция форматирования даты
        function formatDate(dateStr) {
            const msgDate = new Date(dateStr + 'T00:00:00');
            const today = new Date();
            const yesterday = new Date(today);
            yesterday.setDate(today.getDate() - 1);
            const weekAgo = new Date(today);
            weekAgo.setDate(today.getDate() - 7);

            if (msgDate > weekAgo) {
                if (msgDate.toDateString() === today.toDateString()) {
                    return 'Сегодня';
                } else if (msgDate.toDateString() === yesterday.toDateString()) {
                    return 'Вчера';
                } else {
                    const days = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];
                    return days[msgDate.getDay()];
                }
            } else {
                const options = { day: 'numeric', month: 'long', year: 'numeric' };
                return msgDate.toLocaleDateString('ru-RU', options);
            }
        }

        // Загрузка сообщений
        async function loadMessages() {
            try {
                const response = await fetch('/messages');
                const messages = await response.json();

                // Определяем текущего пользователя (чтобы выделять свои сообщения)
                const usernameInput = document.getElementById('username');
                const currentUser = usernameInput.value.trim() || 'гость';

                chatBox.innerHTML = messages.map(msg => {
                    const isMy = msg.username === currentUser;
                    const dateLabel = formatDate(msg.date);

                    return `<div class="message ${isMy ? 'my-message' : ''}">
                        <div class="username">${msg.username}</div>
                        <div class="text">${msg.text}</div>
                        <div class="meta">
                            <span class="time">${msg.time}</span>
                            <span class="date-label">${dateLabel}</span>
                        </div>
                    </div>`;
                }).join('');

                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (e) {
                console.error('Ошибка загрузки:', e);
            }
        }

        // Отправка сообщения
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const text = document.getElementById('text').value.trim();
            if (!username || !text) return;

            const formData = new FormData();
            formData.append('username', username);
            formData.append('text', text);

            try {
                await fetch('/send', { method: 'POST', body: formData });
                document.getElementById('text').value = '';
                await loadMessages();
            } catch (e) {
                console.error('Ошибка отправки:', e);
            }
        });

        // Автообновление каждые 2 секунды
        setInterval(loadMessages, 2000);

        // Первая загрузка
        loadMessages();
    </script>
</body>
</html>
